[project]
name = "tradepilot-backend"
version = "0.1.0"
description = "TradePilot API、Worker 与 MCP 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=2,<3",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
