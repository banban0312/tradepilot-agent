services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy backend/.env.example to backend/.env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy backend/.env.example to backend/.env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    image: tradepilot/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--frozen", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ATTACHMENTS_ROOT: /var/lib/tradepilot/attachments
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - attachments:/var/lib/tradepilot/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)); assert d['status']=='ready'"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: tradepilot/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--frozen", "python", "-m", "app.worker.main"]
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_CONTEXT_SIGNING_KEY: ${MCP_CONTEXT_SIGNING_KEY:-}
    volumes:
      - attachments:/var/lib/tradepilot/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "python", "-m", "app.worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    image: tradepilot/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--frozen", "python", "-m", "app.mcp_server.main"]
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_CONTEXT_SIGNING_KEY: ${MCP_CONTEXT_SIGNING_KEY:-}
      MCP_URL: http://127.0.0.1:8000/mcp
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "python", "-m", "app.mcp_server.healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 8
      start_period: 5s

  web:
    image: tradepilot/web:local
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      TRADEPILOT_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  verify:
    image: tradepilot/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--frozen", "pytest", "-q", "/workspace/tests/issues/test_issue_001.py"]
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_CONTEXT_SIGNING_KEY: ${MCP_CONTEXT_SIGNING_KEY:-}
      MCP_URL: http://mcp:8000/mcp
      TRADEPILOT_MCP_INTEGRATION: "1"
      TRADEPILOT_TEST_MODE: "1"
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_ORIGIN: ${APP_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    profiles: ["verify"]

volumes:
  postgres_data:
  attachments:
